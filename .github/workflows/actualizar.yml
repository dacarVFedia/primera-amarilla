name: Actualizar registro

on:
  workflow_dispatch:
  # Al confirmar un árbitro o cambiar el código, la página se regenera sin esperar a la siguiente hora
  push:
    branches: [main]
    paths:
      - arbitros_confirmados.csv
      - amarillas.py
      - registro.py
      - registro_plantilla.html
      - .github/workflows/actualizar.yml
  schedule:
    # Hora UTC (España va 1 hora por delante en invierno y 2 en verano).
    # Cada 15 minutos en horario de partidos, de 11:07 a 0:52 en invierno, y una vez de madrugada.
    # Minutos poco habituales porque GitHub retrasa o salta más las tareas de las horas en punto.
    - cron: "7,22,37,52 10-23 * * *"
    - cron: "17 6 * * *"

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registro
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar partidos ya descargados
        uses: actions/cache@v4
        with:
          path: cache_amarillas
          key: amarillas-${{ github.run_id }}
          restore-keys: amarillas-
      - name: Generar la página
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python registro.py --no-abrir --estricto
      - name: Preparar la publicación
        run: |
          mkdir _site
          cp registro_amarillas.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub apaga las tareas programadas tras 60 días sin cambios en el repositorio
      - name: Mantener activa la programación
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/actualizar.yml/enable"

  publicar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # GitHub se salta muchas tareas programadas: en horario de partidos cada ejecución lanza la siguiente.
  # Si hay otra ejecución en marcha o en cola, no se lanza nada, para que no haya dos cadenas a la vez.
  encadenar:
    needs: publicar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Madrid
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Esperar y lanzar la siguiente actualización
        run: |
          hora=$(date +%H%M)
          if [ "$hora" -lt 1045 ] && [ "$hora" -gt 0030 ]; then
            echo "Fuera del horario de partidos ($hora): la cadena se para hasta la tarea programada."
            exit 0
          fi
          sleep 780
          otras=$(gh run list -R "$REPO" -w actualizar.yml -L 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$otras" -gt 0 ]; then
            echo "Ya hay $otras ejecución(es) en marcha: no se lanza otra."
            exit 0
          fi
          gh workflow run actualizar.yml -R "$REPO" --ref main
          echo "Siguiente actualización lanzada."
